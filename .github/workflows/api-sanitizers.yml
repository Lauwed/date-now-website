name: API - Sanitizers

# Runs the API under AddressSanitizer + UBSan and under Valgrind, in the dev
# image, with a Postgres database (see api/ci/smoke.sh).

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-sanitizers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-sanitizers.yml'
  workflow_dispatch:

jobs:
  asan:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datenow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build dev image
        run: docker build --target dev -t api-dev api/

      - name: Build with ASAN/UBSan & smoke test
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/datenow \
            api-dev sh ci/smoke.sh asan

  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datenow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build dev image
        run: docker build --target dev -t api-dev api/

      - name: Run under Valgrind & smoke test
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/datenow \
            api-dev sh ci/smoke.sh valgrind
